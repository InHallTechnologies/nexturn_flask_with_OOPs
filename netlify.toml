[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Route all requests to the serverless function
# Mangum will extract the original path from the request event
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200 
