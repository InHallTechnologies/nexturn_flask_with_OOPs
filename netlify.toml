[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Route all requests to the serverless function
# serverless-wsgi will process the request path and route to Flask
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
