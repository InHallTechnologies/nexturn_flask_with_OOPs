[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/students*"
  to = "/.netlify/functions/api:splat"
  status = 200

[[redirects]]
  from = "/test*"
  to = "/.netlify/functions/api:splat"
  status = 200 
