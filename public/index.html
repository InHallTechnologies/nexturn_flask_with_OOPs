<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .endpoints {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        .endpoint {
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .method {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 10px;
            color: white;
            font-size: 11px;
            min-width: 40px;
            text-align: center;
        }
        .method.get {
            background: #61affe;
        }
        .method.post {
            background: #49cc90;
        }
        .path {
            color: #333;
        }
        .docs-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            transition: background 0.3s;
            margin: 10px 5px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .docs-link:hover {
            background: #764ba2;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .status {
            color: #49cc90;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Student Management API</h1>
        <p class="subtitle">Serverless Flask API on Netlify</p>
        
        <div class="endpoints">
            <strong>Available Endpoints:</strong>
            <div class="endpoint">
                <span class="method post">POST</span>
                <span class="path">/students</span> - Add a new student
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span class="path">/students</span> - Get all students
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span class="path">/students/&lt;student_id&gt;</span> - Get specific student
            </div>
            <div class="endpoint">
                <span class="method get">GET</span>
                <span class="path">/test</span> - Health check
            </div>
        </div>

        <div class="button-group">
            <a href="https://github.com" class="docs-link" target="_blank">📖 View Source</a>
            <a href="/.netlify/functions/api/test" class="docs-link">✅ Test API</a>
        </div>

        <div class="status">✅ API is running and ready to use</div>
    </div>
</body>
</html>
